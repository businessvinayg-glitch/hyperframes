    <!-- 36.04 "Do you take the mask or walk away?" -->

  <script>
    const tl = gsap.timeline({ paused: true });

    // Every card: drop in from above, draw its underline, fade out just before its end.
    document.querySelectorAll("#root .card").forEach((card) => {
      const start = parseFloat(card.dataset.start);
      const end = start + parseFloat(card.dataset.duration);
      const box = card.querySelector(".card-box");
      if (start > 0 && !card.hasAttribute("data-slam")) {
        tl.fromTo(box, { y: -36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.24, ease: "power3.out" }, start);
      }
      const bar = card.querySelector(".card-bar");
      if (bar) tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.out" }, start + 0.1);
      if (end < 43) tl.to(box, { opacity: 0, duration: 0.1, ease: "power1.in" }, end - 0.1);
    });

    // Counting value: numeric tween drives the text, so every seek lands on the same number.
    function count(sel, to, start, dur, fmt) {
      const el = document.querySelector(sel);
      const o = { v: 0 };
      el.textContent = fmt(0);
      tl.fromTo(
        o,
        { v: 0 },
        { v: to, duration: dur, ease: "power2.out", onUpdate: () => (el.textContent = fmt(o.v)) },
        start,
      );
    }
    // Typewriter: the full text lives in data-full; a tweened index slices it.
    function type(sel, cursorSel, start, dur, until) {
      const el = document.querySelector(sel);
      const full = el.dataset.full;
      const o = { n: 0 };
      el.textContent = "";
      tl.fromTo(
        o,
        { n: 0 },
        { n: full.length, duration: dur, ease: "none", onUpdate: () => (el.textContent = full.slice(0, Math.round(o.n))) },
        start,
      );
      const blinks = Math.max(1, Math.floor((until - start) / 0.5));
      tl.fromTo(
        cursorSel,
        { opacity: 1 },
        { keyframes: { opacity: [1, 1, 0, 0] }, duration: 0.5, ease: "none", repeat: blinks - 1 },
        start,
      );
    }
    function swap(oldSel, newSel, t) {
      tl.fromTo(oldSel, { opacity: 1 }, { opacity: 0, duration: 0.05 }, t);
      tl.fromTo(newSel, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)" }, t);
    }
    function pulse(sel, t) {
      tl.fromTo(sel, { scale: 1 }, { keyframes: { scale: [1, 1.07, 1] }, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
    }
    function fadeIn(sel, t) {
      tl.fromTo(sel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, t);
    }

    const money = (v) => "$" + (Math.round(v / 100) * 100).toLocaleString("en-US");
    count("#c-found-val", 100000, 0.1, 2.0, money);
    pulse("#c-found .card-box", 2.1);
    fadeIn("#c-found-sub", 2.58);

    fadeIn("#c-rider-sub", 5.48);

    count("#c-rent-val", 3, 10.85, 0.6, (v) => String(Math.round(v)));
    pulse("#c-rent .card-box", 11.45);

    swap("#c-door-old", "#c-door-new", 14.95);
    fadeIn("#c-door-sub", 15.2);
    pulse("#c-door-box", 14.95);
    tl.fromTo("#c-door-box", { borderColor: "rgba(74,222,128,0.85)" }, { borderColor: "rgba(255,74,74,0.95)", duration: 0.1, immediateRender: false }, 14.95);
    tl.fromTo("#c-door .card-bar", { backgroundColor: "#4ade80" }, { backgroundColor: "#ff4a4a", duration: 0.1, immediateRender: false }, 14.95);

    count("#c-years-val", 48, 16.8, 0.9, (v) => String(Math.round(v)));
    fadeIn("#c-years-sub", 17.33);

    type("#c-plan-text", "#c-plan-cursor", 19.15, 0.9, 21.16);

    tl.fromTo("#c-call-dot", { scale: 1 }, { keyframes: { scale: [1, 1.5, 1] }, duration: 0.6, ease: "sine.inOut", repeat: 7 }, 21.2);
    swap("#c-miss-1", "#c-miss-2", 22.62);
    tl.fromTo("#c-miss-2", { opacity: 1 }, { opacity: 0, duration: 0.05, immediateRender: false }, 24.05);
    tl.fromTo("#c-miss-3", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)" }, 24.05);
    tl.fromTo("#c-miss-3", { opacity: 1 }, { opacity: 0, duration: 0.05, immediateRender: false }, 25.06);
    tl.fromTo("#c-miss-4", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)" }, 25.06);

    swap("#c-mask-old", "#c-mask-new", 28.98);
    pulse("#c-mask-box", 28.98);
    tl.fromTo("#c-mask-box", { borderColor: "rgba(74,222,128,0.85)" }, { borderColor: "rgba(255,74,74,0.95)", duration: 0.1, immediateRender: false }, 28.98);
    tl.fromTo("#c-mask .card-bar", { backgroundColor: "#4ade80" }, { backgroundColor: "#ff4a4a", duration: 0.1, immediateRender: false }, 28.98);
    fadeIn("#c-mask-sub", 30.3);

    type("#c-msg-text", "#c-msg-cursor", 31.88, 1.0, 36.0);

    // the twist line slams in instead of typing
    tl.fromTo("#c-msg2-box", { scale: 1.18, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "power4.out" }, 34.28);
    tl.fromTo(
      "#c-msg2-box",
      { x: 0 },
      { keyframes: { x: [0, 18, -16, 12, -8, 4, 0] }, duration: 0.4, ease: "none", immediateRender: false },
      34.28,
    );

    window.__timelines["cards"] = tl;
  </script>
