<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "Montserrat", sans-serif;
    }
    /* Next episode: change the numbers in the timeline script below. */
    #hud-row {
      position: absolute;
      top: 190px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .hud-chip {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 74px;
      padding: 0 22px;
      border-radius: 18px;
      background: rgba(10, 10, 12, 0.72);
      border: 2px solid rgba(255, 255, 255, 0.14);
      color: #fff;
      white-space: nowrap;
    }
    .hud-label {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #a9a9b3;
    }
    .hud-value {
      font-size: 34px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    #hud-cash-val {
      color: #7cf08f;
      min-width: 168px;
    }
    #hud-rent-val {
      position: relative;
      color: #fff;
      min-width: 122px;
    }
    #hud-rent-due {
      position: absolute;
      left: 0;
      top: 0;
      color: #ff4a4a;
      opacity: 0;
    }
    #hud-danger-bar {
      display: flex;
      gap: 6px;
    }
    .hud-seg {
      width: 20px;
      height: 32px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.16);
    }
  </style>
  <div id="root" data-composition-id="hud" data-width="1080" data-height="1920">
    <div id="hud-row">
      <div id="hud-cash" class="hud-chip">
        <span class="hud-label">CASH</span>
        <span id="hud-cash-val" class="hud-value">$0</span>
      </div>
      <div id="hud-rent" class="hud-chip">
        <span class="hud-label">RENT</span>
        <span id="hud-rent-val" class="hud-value"><span id="hud-rent-ok">PAID</span><span id="hud-rent-due">-3 MO</span></span>
      </div>
      <div id="hud-danger" class="hud-chip">
        <span class="hud-label">DANGER</span>
        <span id="hud-danger-bar">
          <span id="hud-d1" class="hud-seg"></span><span id="hud-d2" class="hud-seg"></span><span id="hud-d3" class="hud-seg"></span><span id="hud-d4" class="hud-seg"></span><span id="hud-d5" class="hud-seg"></span>
        </span>
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Episode counters — change per episode.
    const CASH = 100000;
    const DANGER_STEPS = [
      [0.2, 1], // start
      [21.2, 2], // phone lights up
      [29.02, 3], // black ski mask
      [34.28, 5], // "I know where you sleep"
    ];

    tl.fromTo("#hud-row", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0.05);

    // cash counts up while "a hundred thousand dollars" is said
    const cashEl = document.getElementById("hud-cash-val");
    const counter = { v: 0 };
    tl.fromTo(
      counter,
      { v: 0 },
      {
        v: CASH,
        duration: 1.5,
        ease: "power2.out",
        onUpdate: () => {
          cashEl.textContent = "$" + (Math.round(counter.v / 100) * 100).toLocaleString("en-US");
        },
      },
      0.65,
    );
    tl.fromTo("#hud-cash", { scale: 1 }, { keyframes: { scale: [1, 1.12, 1] }, duration: 0.35, ease: "power2.out", immediateRender: false }, 2.1);

    // rent flips to overdue on "three months behind"
    tl.fromTo("#hud-rent-ok", { opacity: 1 }, { opacity: 0, duration: 0.08 }, 11.0);
    tl.fromTo("#hud-rent-due", { opacity: 0 }, { opacity: 1, duration: 0.08 }, 11.0);
    tl.fromTo("#hud-rent", { scale: 1 }, { keyframes: { scale: [1, 1.14, 1] }, duration: 0.4, ease: "power2.out", immediateRender: false }, 11.0);
    tl.fromTo(
      "#hud-rent",
      { borderColor: "rgba(255,255,255,0.14)" },
      { borderColor: "rgba(255,74,74,0.9)", duration: 0.2, immediateRender: false },
      11.0,
    );

    // danger meter climbs
    const colors = ["#ffc531", "#ffa531", "#ff7a31", "#ff4a4a", "#ff2020"];
    let lit = 0;
    DANGER_STEPS.forEach(([t, level]) => {
      for (let i = lit + 1; i <= level; i++) {
        tl.fromTo(
          "#hud-d" + i,
          { backgroundColor: "rgba(255,255,255,0.16)" },
          { backgroundColor: colors[i - 1], duration: 0.1, immediateRender: false },
          t + (i - lit - 1) * 0.06,
        );
      }
      lit = level;
      tl.fromTo("#hud-danger", { scale: 1 }, { keyframes: { scale: [1, 1.14, 1] }, duration: 0.4, ease: "power2.out", immediateRender: false }, t);
    });
    tl.fromTo(
      "#hud-danger",
      { borderColor: "rgba(255,255,255,0.14)" },
      { borderColor: "rgba(255,32,32,1)", duration: 0.15, immediateRender: false },
      34.28,
    );

    // stay out of the vote card's way
    tl.to("#hud-row", { opacity: 0.35, duration: 0.3 }, 38.6);

    window.__timelines["hud"] = tl;
  </script>
</template>
