<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Montserrat", sans-serif;
      }
      #stage-ground {
        position: absolute;
        inset: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="43.47"
      data-width="1080"
      data-height="1920"
    >
      <div id="stage-ground"></div>

      <!-- Picture: ten shots cut on the voiceover's line starts -->
      <div
        id="shots"
        data-composition-id="shots"
        data-composition-src="compositions/shots.html"
        data-start="0"
        data-duration="43.47"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>

      <!-- The twist: the text from the rider -->
      <div
        id="message"
        data-composition-id="message"
        data-composition-src="compositions/message.html"
        data-start="31.8"
        data-duration="4.24"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>

      <!-- Vote card -->
      <div
        id="vote"
        data-composition-id="vote"
        data-composition-src="compositions/vote.html"
        data-start="38.6"
        data-duration="4.87"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>

      <!-- Game HUD: cash / rent / danger counters -->
      <div
        id="hud"
        data-composition-id="hud"
        data-composition-src="compositions/hud.html"
        data-start="0"
        data-duration="43.47"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>

      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="43.47"
        data-track-index="6"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 6"
      ></div>

      <!-- Voice is the clock -->
      <audio
        id="voice"
        src="assets/voice.mp3"
        data-start="0"
        data-duration="43.47"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <audio
        id="rain-bed"
        src="assets/sfx/rain-bed.mp3"
        data-start="0"
        data-duration="43.47"
        data-track-index="11"
        data-volume="0.55"
        data-fade-in="0.3"
        data-fade-out="1.5"
      ></audio>

      <audio id="sfx-buzz-1" src="assets/sfx/phone-buzz.wav" data-start="21.25" data-duration="1.24" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-buzz-2" src="assets/sfx/phone-buzz.wav" data-start="22.62" data-duration="1.24" data-track-index="15" data-volume="0.3"></audio>
      <audio id="sfx-buzz-3" src="assets/sfx/phone-buzz.wav" data-start="24.05" data-duration="1.24" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-buzz-4" src="assets/sfx/phone-buzz.wav" data-start="25.06" data-duration="1.24" data-track-index="15" data-volume="0.35"></audio>
      <audio id="sfx-mask-thud" src="assets/sfx/thud.wav" data-start="29.02" data-duration="1" data-track-index="13" data-volume="0.7"></audio>
      <audio id="sfx-riser" src="assets/sfx/riser.wav" data-start="32.98" data-duration="1.3" data-track-index="13" data-volume="0.45"></audio>
      <audio id="sfx-twist" src="assets/sfx/impact.wav" data-start="34.28" data-duration="3" data-track-index="14" data-volume="0.9"></audio>
      <audio id="sfx-vote-thud" src="assets/sfx/thud.wav" data-start="38.6" data-duration="1" data-track-index="13" data-volume="0.6"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
